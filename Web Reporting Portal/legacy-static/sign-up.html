<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SU Eleme Reporting Portal</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>
    <div class="registration-container">
        <div class="login-header">
            <div class="logo-placeholder"><img src="assets/logo.png" alt="SU Logo" class="logo-img"></div>
            <h1>Request Access</h1>
            <p>Scripture Union Eleme Area Reporting System</p>
        </div>

        <div class="registration-card">
            <h2>Create Account</h2>
            <p class="subtitle">Please provide your official details for verification.</p>
            
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Firstname Lastname" required>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group flex-2">
                        <label>Zone</label>
                        <select id="zone" required>
                            <option value="" disabled selected>Select your Zone</option>
                            <option value="Nchia">Nchia</option>
                            <option value="Oyigbo">Oyigbo</option>
                            <option value="Afam">Afam</option>
                            <option value="Odido/Tai">Odido/Tai</option>
                            <option value="Gokana">Gokana</option>
                            <option value="Bori">Bori</option>
                            <option value="Etche">Etche</option>
                            <option value="Omuma">Omuma</option>
                            <option value="Andoni">Andoni</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Official Role / Position</label>
                    <select id="role" required>
                        <option value="" disabled selected>Select your Role</option>
                        <option value="Travelling Secretary">Travelling Secretary</option>
                        <option value="Missionary">Missionary</option>
                        <option value="Zonal Rep">Zonal Rep</option>
                        <option value="Zonal Schools Coordinator">Zonal Schools' Coordinator</option>
                        <option value="Department Head">Department Head</option>
                        <option value="Area Leader">Area Leader</option>
                        <option value="System Admin">System Admin</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="official@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="080..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required>
                </div>

<div class="security-setup-box">
    <h4 style="color: #1b5e20; margin-bottom: 10px; font-size: 0.9rem;">Account Security Recovery</h4>
    <div class="form-group">
        <label>Select Security Question</label>
        <select id="securityQuestion" required>
            <option value="" disabled selected>Choose a question...</option>
            <option>What was the name of your first Sunday School teacher?</option>
            <option>In what city did you attend your first SU Camp?</option>
            <option>What is the name of your favorite Bible character?</option>
            <option>What was the title of your first soul-winning message?</option>
        </select>
    </div>
    <div class="form-row">
        <div class="form-group flex-1">
            <label>Secret Answer</label>
            <input type="text" id="securityAnswer" placeholder="Your answer" required>
        </div>
        <div class="form-group flex-1">
            <label>Answer Hint (Optional)</label>
            <input type="text" id="securityHint" placeholder="e.g. Starts with 'M'">
        </div>
    </div>
</div>

                <div class="form-group">
                    <label>Reason for Access (Optional)</label>
                    <textarea id="reason" rows="2" placeholder="Briefly state your current assignment..."></textarea>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">Submit Registration</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
        
        <div class="login-footer">
            Your registration is subject to Admin approval.
        </div>
    </div>

</body>
</html>
