<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SU Eleme Reporting Portal</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="registration-container">
        <div class="login-header">
            <div class="logo-placeholder">SU</div>
            <h1>Request Access</h1>
            <p>Scripture Union Eleme Area Reporting System</p>
        </div>

        <div class="registration-card">
            <h2>Create Account</h2>
            <p class="subtitle">Please provide your official details for verification.</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Firstname Lastname" class="memory-input" list="saved-reg-names" data-category="reg_names" required id="signup-name">
                    <datalist id="saved-reg-names"></datalist>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label>Gender</label>
                        <select required id="signup-gender">
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group flex-2">
                        <label>Zone</label>
                        <select required id="signup-zone">
                            <option value="" disabled selected>Select your Zone</option>
                            <option value="Nchia">Nchia</option>
                            <option value="Oyigbo">Oyigbo</option>
                            <option value="Afam">Afam</option>
                            <option value="Odido/Tai">Odido/Tai</option>
                            <option value="Gokana">Gokana</option>
                            <option value="Bori">Bori</option>
                            <option value="Etche">Etche</option>
                            <option value="Omuma">Omuma</option>
                            <option value="Andoni">Andoni</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Official Role / Position</label>
                    <select required id="signup-role">
                        <option value="" disabled selected>Select your Role</option>
                        <option value="Travelling Secretary">Travelling Secretary</option>
                        <option value="Missionary">Missionary</option>
                        <option value="Zonal Rep">Zonal Rep</option>
                        <option value="Zonal Schools Coordinator">Zonal Schools' Coordinator</option>
                        <option value="Department Head">Department Head</option>
                        <option value="Area Leader">Area Leader</option>
                        <option value="System Admin">System Admin</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="official@email.com" required id="signup-email">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="080..." class="memory-input" list="saved-reg-phones" data-category="reg_phones" required id="signup-phone">
                        <datalist id="saved-reg-phones"></datalist>
                    </div>
                </div>

                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" placeholder="Min. 8 characters" required id="signup-password">
                </div>

                <div class="security-setup-box" style="background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px;">
                    <h4 style="color: #1b5e20; margin-bottom: 10px; font-size: 0.9rem;">Account Security Recovery</h4>
                    
                    <div class="form-group">
                        <label>Select Security Question</label>
                        <select required id="signup-question" onchange="toggleCustomQuestionField()">
                            <option value="" disabled selected>Choose a question...</option>
                            <option value="What was the name of your first Sunday School teacher?">What was the name of your first Sunday School teacher?</option>
                            <option value="In what city did you attend your first SU Camp?">In what city did you attend your first SU Camp?</option>
                            <option value="What is the name of your favorite Bible character?">What is the name of your favorite Bible character?</option>
                            <option value="What was the title of your first soul-winning message?">What was the title of your first soul-winning message?</option>
                            <option value="CUSTOM">-- Write my own custom security question --</option>
                        </select>
                    </div>

                    <div class="form-group" id="custom-question-group" style="display: none; margin-top: 10px;">
                        <label style="color: #c62828;">Type Your Custom Security Question</label>
                        <input type="text" placeholder="e.g., What is the name of my home village church?" id="signup-custom-question" class="dash-input" style="width: 100%; box-sizing: border-box;">
                    </div>

                    <div class="form-row" style="margin-top: 10px;">
                        <div class="form-group flex-1">
                            <label>Secret Answer</label>
                            <input type="text" placeholder="Your answer" required id="signup-answer">
                        </div>
                        <div class="form-group flex-1">
                            <label>Answer Hint (Optional)</label>
                            <input type="text" placeholder="e.g. Starts with 'M'" id="signup-hint">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Reason for Access (Optional)</label>
                    <textarea rows="2" placeholder="Briefly state your current assignment..."></textarea>
                </div>

                <button type="submit" class="btn-login">Submit Registration</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="index.html">Sign In</a></p>
        </div>
        
        <div class="login-footer">
            Your registration is subject to Admin approval.
        </div>
    </div>

    <script>
        function toggleCustomQuestionField() {
            const selectField = document.getElementById('signup-question');
            const customFieldGroup = document.getElementById('custom-question-group');
            const customInput = document.getElementById('signup-custom-question');

            if (selectField.value === 'CUSTOM') {
                customFieldGroup.style.display = 'block';
                customInput.setAttribute('required', 'true');
                customInput.focus();
            } else {
                customFieldGroup.style.display = 'none';
                customInput.removeAttribute('required');
                customInput.value = '';
            }
        }
    </script>
    <script src="assets/app-scripts.js"></script>
</body>
</html>
